name: Probe official portrait URLs
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect proxy picture sources
        run: |
          python3 - <<'PY'
          import urllib.request,re,html
          urls=['https://assets.hoyotoon.com/?game=zzz&type=characters',
            'https://zenless.hoyoverse.com/en-us/main?catchSpider=1',
            'https://esports.gg/news/zenless-zone-zero-zzz/who-is-the-main-character-in-zenless-zone-zero-zzz/']
          for url in urls:
           print('URL:',url)
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            content=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
            print('LEN:',len(content))
            for word in ('Belle','Wise','Phaethon','og:image','/assets/'):
             matches=list(re.finditer(word,content,re.I))
             print('KEY',word,'COUNT',len(matches))
             for m in matches[:2]:
              i=m.start();print('CTX',repr(content[max(0,i-450):i+190]))
           except Exception as e:print('ERROR:',type(e).__name__,str(e))
          PY
