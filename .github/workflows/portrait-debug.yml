name: Probe official portrait URLs
on:
  push:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect proxy portraits API
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json
          base='https://zenless-zone-zero.fandom.com/api.php'
          for character in ['Belle','Wise']:
           title='File:Agent_'+character+'_Portrait.png'
           params=urllib.parse.urlencode({'action':'query','titles':title,'prop':'imageinfo','iiprop':'url','format':'json'})
           try:
            req=urllib.request.Request(base+'?'+params,headers={'User-Agent':'Mozilla/5.0 (compatible; ZZZManager/3.3; contact:github.com/Gabriel-Liz2003/ZZZ-MANAGER)'})
            response=urllib.request.urlopen(req,timeout=20)
            raw=response.read().decode('utf-8')
            print(character,"STATUS",response.status,"LENGTH",len(raw),"PREVIEW",raw[:700])
           except Exception as e:print(character,'ERROR',type(e).__name__,str(e))
          PY
